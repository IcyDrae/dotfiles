conky.config = {
    alignment = 'top_right',

    background = false,
    update_interval = 1,

    double_buffer = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    use_xft = true,
    font = 'IoskeleyMono Nerd Font:size=10',
    xftalpha = 1,

    gap_x = 25,
    gap_y = 150,

    minimum_width = 300,
    maximum_width = 300,

    draw_shades = false,
    draw_outline = false,

    default_color = '#ebdbb2',
    color1 = '#83a598',
    color2 = '#b8bb26',
    color3 = '#fabd2f',
    color4 = '#fb4934',
};

conky.text = [[
${color1}${font IoskeleyMono Nerd Font:bold:size=13}SYSTEM${font}${color}
${hr}

${color2}HOST${color}      ${nodename}
${color2}KERNEL${color}    ${kernel}
${color2}UPTIME${color}    ${uptime}

${color1}CPU${color}
${cpubar cpu0 8,300}
${cpu cpu0}% ${alignr}${freq_g} GHz

${color1}MEMORY${color}
${membar 8,300}
$mem / $memmax ${alignr}$memperc%

${color1}DISK${color}
${fs_bar 8,300 /}
${fs_used /} / ${fs_size /} ${alignr}${fs_used_perc /}%

${color1}NETWORK${color}
Down: ${downspeedf enp*} KiB/s
Up:   ${upspeedf enp*} KiB/s
]];

