
# Set default shell
set-option -g default-shell /usr/bin/zsh
set-option -g default-command /usr/bin/zsh

# Sane defaults
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix
set -g allow-passthrough on

# Split windows
unbind %
unbind '"'
bind v split-window -v -c "#{pane_current_path}" 
bind h split-window -h -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file $HOME/.tmux.conf

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift+arrows to switch windows
bind -n S-left previous-window
bind -n S-right next-window

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Name of session width
set -g status-left-length 50

# Name of session style
set -g status-left "#[fg=#A3BE8C,bold]#S #[fg=#D8DEE9,nobold] >> "

# Current window style
set -g window-status-current-format "#[fg=#88C0D0,bold] #I:#W"

# Message style
set -g message-style "fg=#D8DEE9,bg=default"

# Status bar style
set -g status-style "fg=#D8DEE9,bg=default"


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'








