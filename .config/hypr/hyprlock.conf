general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/reard/Pictures/Wallpapers/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.65
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = Iosevka
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = Iosevka
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    position = 0, -100
    halign = center
    valign = center

    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(30, 30, 46, 0.85)
    font_color = rgba(205, 214, 244, 1.0)

    outline_thickness = 2
    rounding = 12
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    dots_center = true
    shadow_passes = 2
}

